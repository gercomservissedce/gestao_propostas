<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Propostas</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🌡️</text></svg>">
<script>
  // Define o tema antes da primeira pintura, para não "piscar" o tema errado.
  (function () {
    var salvo = localStorage.getItem('gp-tema');
    var tema = salvo || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = tema;
  })();
</script>
</head>
<body>

<header class="topo">
  <div class="topo-marca">
    <span class="topo-logo">🌡️</span>
    <div>
      <h1>Gestão de Propostas</h1>
      <span class="topo-sub">Acompanhamento comercial</span>
    </div>
  </div>
  <nav class="abas" id="abas">
    <button class="aba ativa" data-tela="dashboard">Dashboard</button>
    <button class="aba" data-tela="propostas">Propostas</button>
    <button class="aba" data-tela="consultores">Consultores</button>
    <button class="aba" data-tela="relatorio">Relatório Diretoria</button>
  </nav>
  <button class="btn-icone" id="btn-tema" title="Alternar tema claro/escuro">🌙</button>
  <button class="btn-icone" id="btn-config" title="Configurações">⚙</button>
</header>

<main>
  <section id="tela-dashboard" class="tela"></section>
  <section id="tela-propostas" class="tela oculta"></section>
  <section id="tela-consultores" class="tela oculta"></section>
  <section id="tela-relatorio" class="tela oculta"></section>
</main>

<div id="modal-fundo" class="modal-fundo oculta">
  <div id="modal-caixa" class="modal-caixa"></div>
</div>

<div id="aviso" class="aviso oculta"></div>

<script src="js/format.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/propostas.js"></script>
<script src="js/consultores.js"></script>
<script src="js/relatorio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
